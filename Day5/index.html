<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - Users API</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>Users Directory</h1>
        <p>Load and filter users from a practice API.</p>
    </header>

    <main>
        <section>
            <button id="load-users" type="button">Load Users</button>

            <label for="filter-input">Filter users by name:</label>
            <input
                id="filter-input"
                type="text"
                placeholder="Enter a name..."
            >

            <p id="status" role="status">Click Load Users to begin.</p>

            <ul id="users-list"></ul>
        </section>
    </main>
</body>
</html>
